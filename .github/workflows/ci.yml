name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: mvn test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=taskdb
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres123
          JWT_SECRET=ci-only-dummy-jwt-secret-not-for-production
          JWT_EXPIRATION_MS=86400000
          BACKEND_PORT=8080
          FRONTEND_PORT=5173
          TASK_MANAGER_AUTH_USERNAME=admin
          TASK_MANAGER_AUTH_PASSWORD=admin123
          TASK_MANAGER_AUTH_ROLE=ROLE_ADMIN
          TASK_MANAGER_CORS_ALLOWED_ORIGINS=http://localhost:5173
          VITE_API_BASE_URL=http://localhost:8080
          EOF

      - name: Validate Docker Compose config
        run: docker compose config
